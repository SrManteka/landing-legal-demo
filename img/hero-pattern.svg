<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#D4AF37" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- Balanza de la justicia, muy tenue -->
  <g fill="none" stroke="#D4AF37" stroke-opacity="0.12" stroke-width="3" transform="translate(960 540)">
    <line x1="0" y1="-300" x2="0" y2="260"/>
    <line x1="-120" y1="260" x2="120" y2="260"/>
    <line x1="-300" y1="-240" x2="300" y2="-240"/>
    <path d="M-300 -240 L-380 -60 H-220 Z"/>
    <path d="M300 -240 L220 -60 H380 Z"/>
    <path d="M-380 -60 A80 40 0 0 0 -220 -60"/>
    <path d="M220 -60 A80 40 0 0 0 380 -60"/>
  </g>
</svg>
